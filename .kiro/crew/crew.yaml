# crew-rocket crew manifest.
#
# Descriptive source of truth for the team. `kirocrew config get` (checked
# against a real 0.7.1 install) exposes exactly two GLOBAL backend knobs -
# `agent.acp_backend` (this session's own backend) and `agent.member_acp_backend`
# (the backend a session delegates spawned/subagent work to) - there is no
# per-named-member key. So the three `backend:` fields below cannot all be
# live in KiroCrew's config at once; setup.sh applies meowth's to
# agent.acp_backend and jessie's to member_acp_backend (she's the one meowth
# spawns as a challenger during rocket-plan), and james gets a real switch
# via `scripts/rocket-use-backend.sh james` before you start his session.
#
# KiroCrew's selectable backends as of writing: kiro, claude, kas, codex,
# opencode, pi, goose. There is no first-class "openrouter" or "devpass"
# backend — those are model gateways, not agent CLIs. Point either one at
# `opencode`, which speaks arbitrary OpenAI-compatible providers; setup.sh
# writes the provider block for you when you pick openrouter or devpass.
#
# Edit backend/effort here any time; rerun setup.sh, or use
# `scripts/rocket-use-backend.sh <member>` / `kirocrew config edit` directly.

members:
  meowth:
    role: >
      Plans and discovers. Given WHY and WHAT, digs through the code, drafts
      the HOW, cites every source, and logs every decision in beads.
    skills: [rocket-ideate, rocket-plan, rocket-confirm-plan, rocket-approval-check, rocket-retro]
    backend: claude
    effort: high

  jessie:
    role: >
      Challenges the plan, then proves the built thing works: runs it,
      attacks it, checks nothing regressed. Test probes only, never
      production code.
    skills: [rocket-verify, rocket-confirm]
    backend: claude
    effort: high

  james:
    role: >
      Executes. The task tells him what and how. If reality disagrees with
      the task, he stops and returns it.
    skills: [rocket-implement, rocket-fix, rocket-pr, rocket-harvest]
    backend: codex
    effort: medium
